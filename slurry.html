<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toby's Estate Coffee Roasters | Brand Hub - Slurry Recipes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:ital,wght@0,400..900;1,400..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☕</text></svg>">
</head>

<body>
    <header class="brand-bar" role="banner">
        <div class="brand-bar-inner">
            <div class="brand-logo-group">
                <img src="img/logo.png" alt="Toby's Estate Coffee" class="brand-logo">
                <span class="brand-resource-text"><span class="brand-resource-divider">|</span> Brand Hub</span>
            </div>

            <button class="hamburger-menu" id="hamburger-menu" aria-label="Toggle Navigation" aria-expanded="false">
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
            </button>

            <nav class="brand-nav" id="brand-nav" aria-label="Resource pages">
                <a href="https://tobysestatecoffee.github.io/design-templates/" class="brand-nav-link">
                    <span class="nav-icon">📐</span>
                    Design Templates
                </a>
                <a href="https://tobysestatecoffee.github.io/recipe-guides/" class="brand-nav-link active"
                    aria-current="page">
                    <span class="nav-icon">☕</span>
                    Cafè Recipes
                </a>
                <a href="https://tobysestatecoffee.github.io/coffee-philosophy/" class="brand-nav-link">
                    <span class="nav-icon">🎥</span>
                    Coffee Philosophy
                </a>
            </nav>
        </div>
    </header>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const hamburgerMenu = document.getElementById('hamburger-menu');
            const brandNav = document.getElementById('brand-nav');
            if (hamburgerMenu && brandNav) {
                hamburgerMenu.addEventListener('click', () => {
                    const isActive = brandNav.classList.toggle('active');
                    hamburgerMenu.classList.toggle('active');
                    hamburgerMenu.setAttribute('aria-expanded', isActive);
                });
            }
        });
    </script>

    <!-- ── Page Hero ─────────────────────────────────────────────────────── -->
    <section class="page-hero">
        <div class="page-hero-inner">
            <div class="hero-text" style="display: flex; flex-direction: row; align-items: center; gap: 1rem;">
                <div>
                    <h1 class="page-title">Slurry Recipes</h1>
                </div>
            </div>
            <div class="hero-meta">
                <div class="category-dropdown-container">
                    <label for="category-dropdown" class="category-label" style="display:none;">Change drink
                        category</label>
                    <select id="category-dropdown" class="sort-select" onchange="location = this.value;"
                        style="background-color: var(--bg-card);">
                        <option value="" disabled selected>Change drink category</option>
                        <option value="coffee.html">Coffee</option>
                        <option value="chocchaimatcha.html">Chocolate, Chai & Matcha</option>
                        <option value="tea.html">Tea</option>
                        <option value="slurry.html">Slurry</option>
                    </select>
                </div>
            </div>
        </div>
    </section>

    <main class="main-content" role="main" style="padding-top: 2rem;">
        <div id="slurryList" class="recipe-list">
            <!-- Slurry recipes will be loaded here by JavaScript -->
        </div>
    </main>

    <footer class="site-footer" role="contentinfo">
        &copy; 2026 Toby's Estate Coffee Roasters. All rights reserved.
    </footer>

    <script src="slurry.js"></script>
</body>

</html>
